<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Report Generator </title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h1>BugBounty / Pentest Report Generator </h1>

<form id="reportForm">
  <label>Target:</label>
  <input type="text" id="target"><br>

  <label>URL:</label>
  <input type="text" id="url"><br>

  <label>Tipo di test:</label>
  <select id="type">
    <option>Bug Bounty</option>
    <option>Pentest Web</option>
    <option>Vulnerability Assessment</option>
  </select><br>

  <label>Descrizione vulnerabilità:</label><br>
  <textarea id="desc" rows="4" cols="50"></textarea><br>

  <label>Severity:</label>
  <select id="severity">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
    <option>Critical</option>
  </select><br>

  <label>Proof of Concept:</label><br>
  <textarea id="poc" rows="3"></textarea><br>

  <label>Screenshot URLs (uno per riga):</label><br>
  <textarea id="screenshots" rows="3"></textarea><br>

  <label>Mitigation / Recommendations:</label><br>
  <textarea id="mitigation" rows="3"></textarea><br>

  <button type="button" onclick="generateReport()">Genera Report</button>
  <button type="button" onclick="downloadPDF()">Download PDF</button>
</form>

<h2>Anteprima Report:</h2>
<pre id="output"></pre>

<script src="script.js"></script>
</body>
</html>
